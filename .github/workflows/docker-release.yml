name: Docker Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  docker-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare variables
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          image_name="$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')"
          asset_name="${image_name}-${tag}-docker-image.tar.gz"

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "image_name=${image_name}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${asset_name}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build -t "${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.tag }}" .

      - name: Save Docker image
        run: |
          mkdir -p dist
          docker save "${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.tag }}" \
            | gzip > "dist/${{ steps.vars.outputs.asset_name }}"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.vars.outputs.tag }}" >/dev/null 2>&1; then
            gh release upload "${{ steps.vars.outputs.tag }}" "dist/${{ steps.vars.outputs.asset_name }}" --clobber
          else
            gh release create "${{ steps.vars.outputs.tag }}" "dist/${{ steps.vars.outputs.asset_name }}" \
              --title "${{ steps.vars.outputs.tag }}" \
              --notes "Docker image asset for ${{ steps.vars.outputs.tag }}."
          fi
